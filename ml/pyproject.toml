[project]
name = "pilltally"
version = "0.1.0"
description = "pilltally real-time pill counting using yolo26n"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3.0",
    "mlflow>=2.14.0",
    "roboflow>=1.1.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxslim>=0.1.0",
    "opencv-python>=4.10.0",
    "pillow>=10.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "requests>=2.32.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
    "mlruns",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming (function snake_case, class PascalCase)
    "PTH", # flake8-use-pathlib (enforce pathlib.Path over os.path)
    "BLE", # flake8-blind-except (avoid bare except / blind Exception)
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Function call in argument defaults (common in Pydantic/FastAPI)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001"]
"notebooks/**" = ["E741", "F841", "W293", "W291", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
