[project]
name = "pilltally-backend"
version = "0.1.0"
description = "pilltally api for pill counting with onnx runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming (function snake_case, class PascalCase)
    "PTH", # flake8-use-pathlib (enforce pathlib.Path over os.path)
    "BLE", # flake8-blind-except (avoid bare except / blind Exception)
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Function call in argument defaults (common in Pydantic/FastAPI)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
